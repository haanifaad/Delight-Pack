<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>My Google AI Studio App</title>
          <style type="text/tailwindcss">
    @theme {
      --color-primary: var(--primary);
      --color-primary-light: var(--primary-light);
      --color-primary-dark: var(--primary-dark);
      --color-secondary: var(--secondary);
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-hover: var(--card-hover);
      --color-border: var(--border);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --font-sans: 'Inter', sans-serif;
    }

    /* DP Mode (Ultra Premium: Obsidian Black + Glassmorphism + DP Auras) */
    :root, [data-theme="dp"] {
      --primary: #123bb5; 
      --primary-light: #3b82f6;
      --primary-dark: #1e3a8a;
      --secondary: #d81b21;
      --background: #050505; /* Obsidian Black */
      --foreground: #fdfdfd;
      --card: rgba(255, 255, 255, 0.02); /* Glassmorphism Base */
      --card-hover: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08); /* Frosted edges */
      --muted: rgba(255, 255, 255, 0.05); 
      --muted-foreground: #94a3b8;
      --accent: #fdfdfd; /* Keep icons clean and white so they pop against the glows */
      color-scheme: dark;
    }

    /* Light Mode (Clean editorial white) */
    [data-theme="light"] {
      --primary: #0f172a;
      --primary-light: #334155;
      --primary-dark: #020617;
      --secondary: #475569;
      --background: #ffffff;
      --foreground: #1e293b;
      --card: #f8fafc;
      --card-hover: #f1f5f9;
      --border: #cbd5e1;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --accent: #0f172a;
      color-scheme: light;
    }

    /* Dark Mode (Grayscale, pure black/white) */
    [data-theme="dark"] {
      --primary: #ffffff; 
      --primary-light: #f1f5f9;
      --primary-dark: #cbd5e1;
      --secondary: #94a3b8;
      --background: #000000;
      --foreground: #ffffff;
      --card: #0a0a0a;
      --card-hover: #111111;
      --border: #1c1c1c;
      --muted: #1c1c1c;
      --muted-foreground: #a3a3a3;
      --accent: #ffffff;
      color-scheme: dark;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      transition: background-color 0.4s ease, color 0.4s ease;
      margin: 0;
      position: relative;
    }
    
    /* Aura logic */
    #dp-aura {
      display: none;
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      overflow: hidden;
    }
    [data-theme="dp"] #dp-aura {
      display: block;
    }
    
    /* Cinematic Glass Card Hover Glow for DP Mode */
    [data-theme="dp"] .glass-card {
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    [data-theme="dp"] .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px -10px rgba(29, 78, 216, 0.15), 0 0 30px -10px rgba(216, 27, 33, 0.15);
    }
    
    .icon-accent {
      color: var(--accent);
    }
    
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.05); }
    }
    .animate-pulse-slow {
      animation: pulse-slow 8s ease-in-out infinite;
    }
  </style>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme-mode');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        document.documentElement.setAttribute('data-theme', 'dp');
      }
    })();
  </script>

  <script>
    // Initialization script to set theme immediately and prevent flash
    (function() {
      const savedTheme = localStorage.getItem('theme-mode');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);

  <body>

  <!-- Ambient DP Aura Glow (Only visible in DP Mode) -->
  <!-- Ambient Interactive DP Aura Glow (Only visible in DP Mode) -->
  <div id="dp-aura">
    <div id="dp-orb-blue" class="fixed top-0 left-0 w-[600px] h-[600px] -ml-[300px] -mt-[300px] bg-[#2563EB] rounded-full mix-blend-screen filter blur-[140px] opacity-30 pointer-events-none" style="transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);"></div>
    <div id="dp-orb-red" class="fixed top-0 left-0 w-[800px] h-[800px] -ml-[400px] -mt-[400px] bg-[#DC2626] rounded-full mix-blend-screen filter blur-[180px] opacity-20 pointer-events-none" style="transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);"></div>
  </div>
  
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
  
  
  
  <!-- Premium Pill Theme Switcher -->
  <div id="theme-switcher-container" style="position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 9999;">
    <div class="flex items-center gap-1 p-1 bg-[#050505]/90 backdrop-blur-3xl border border-white/10 rounded-full shadow-2xl">
      <button onclick="setTheme('dp')" id="btn-dp" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all text-white/40 hover:text-white">
        <span class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-[#123bb5] to-[#d81b21] shadow-[0_0_10px_rgba(29,78,216,0.5)]"></span>
        DP Mode
      </button>
      <button onclick="setTheme('light')" id="btn-light" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all text-white/40 hover:text-white">
        <i data-lucide="sun" class="w-4 h-4"></i>
        Light
      </button>
      <button onclick="setTheme('dark')" id="btn-dark" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all text-white/40 hover:text-white">
        <i data-lucide="moon" class="w-4 h-4"></i>
        Dark
      </button>
    </div>
  </div>
  <script>
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme-mode', theme);
      updateSwitcherUI(theme);
    }

    function updateSwitcherUI(theme) {
      const btns = ['dp', 'light', 'dark'];
      btns.forEach(t => {
        const btn = document.getElementById('btn-' + t);
        if(!btn) return;
        if(t === theme) {
          btn.classList.add('bg-white/10', 'text-white', 'shadow-sm');
          btn.classList.remove('text-white/40');
        } else {
          btn.classList.remove('bg-white/10', 'text-white', 'shadow-sm');
          btn.classList.add('text-white/40');
        }
      });
      if(window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      let currentTheme = localStorage.getItem('theme-mode') || 'dp';
      updateSwitcherUI(currentTheme);
    });
  </script>

  


  


  


  


  


  


  <div class="pointer-blobs" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; overflow: hidden;">
    <div class="blob-blue" style="position: absolute; left: var(--mouse-x, 50vw); top: var(--mouse-y, 50vh); width: 1400px; height: 1400px; background: radial-gradient(circle, rgba(37,99,235,0.3) 0%, transparent 60%); transform: translate(-80%, -50%); transition: left 0.15s ease-out, top 0.15s ease-out, opacity 0.5s; opacity: 0; filter: blur(80px);"></div>
    <div class="blob-red" style="position: absolute; left: var(--mouse-x, 50vw); top: var(--mouse-y, 50vh); width: 1400px; height: 1400px; background: radial-gradient(circle, rgba(220,38,38,0.3) 0%, transparent 60%); transform: translate(-20%, -50%); transition: left 0.4s ease-out, top 0.4s ease-out, opacity 0.5s; opacity: 0; filter: blur(80px);"></div>
  </div>


  <script>
    document.addEventListener('mousemove', (e) => {
      const isDp = document.documentElement.getAttribute('data-theme') === 'dp';
      const blue = document.querySelector('.blob-blue');
      const red = document.querySelector('.blob-red');
      
      if (blue && red) {
        if (isDp) {
          blue.style.opacity = '1';
          red.style.opacity = '1';
          blue.style.setProperty('--mouse-x', e.clientX + 'px');
          blue.style.setProperty('--mouse-y', e.clientY + 'px');
          red.style.setProperty('--mouse-x', e.clientX + 'px');
          red.style.setProperty('--mouse-y', e.clientY + 'px');
        } else {
          blue.style.opacity = '0';
          red.style.opacity = '0';
        }
      }
    });

    // Also update on theme change in case mouse doesn't move
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'data-theme') {
          const isDp = document.documentElement.getAttribute('data-theme') === 'dp';
          const blue = document.querySelector('.blob-blue');
          const red = document.querySelector('.blob-red');
          if (blue && red) {
            blue.style.opacity = isDp ? '1' : '0';
            red.style.opacity = isDp ? '1' : '0';
          }
        }
      });
    });
    observer.observe(document.documentElement, { attributes: true });
  </script>

</body>
